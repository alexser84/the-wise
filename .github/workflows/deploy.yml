name: Deploy Application

on:
  push:
    branches:
      - main
      - feat/static-to-node-app

env:
  PROJECT_DIR: /root/project

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install dependencies
      run: npm install

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v2
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/the-wise:latest

    - name: Install doctl
      run: |
        curl -sL https://github.com/digitalocean/doctl/releases/download/v1.64.0/doctl-1.64.0-linux-amd64.tar.gz | tar -xzv
        sudo mv doctl /usr/local/bin

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Install doctl
      run: |
        curl -sL https://github.com/digitalocean/doctl/releases/download/v1.64.0/doctl-1.64.0-linux-amd64.tar.gz | tar -xzv
        sudo mv doctl /usr/local/bin    

    - name: Validate if droplet exists
      id: check_droplet
      run: |
        doctl auth init -t ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        if doctl compute droplet list the-wise-app --format Name | grep -q the-wise-app; then
          echo "Droplet exists"
          echo "exists=true" >> $GITHUB_ENV
        else
          echo "Droplet does not exist"
          echo "exists=false" >> $GITHUB_ENV
        fi

    - name: Power on droplet if exists
      if: env.exists == 'true'
      run: |
        doctl auth init -t ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        DROPLET_ID=$(doctl compute droplet list the-wise-app --format ID --no-header)
        if [ $(doctl compute droplet get $DROPLET_ID --format Status --no-header) != "active" ]; then
          doctl compute droplet-action power-on $DROPLET_ID
          while [ $(doctl compute droplet get $DROPLET_ID --format Status --no-header) != "active" ]; do
            echo "Waiting for droplet to be active..."
            sleep 5
          done
        fi

    - name: Set up DigitalOcean droplet
      if: env.exists == 'false'
      run: |
        doctl auth init -t ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        doctl compute droplet create the-wise-app \
          --region nyc3 \
          --image docker-20-04 \
          --size s-1vcpu-1gb \
          --ssh-keys ${{ secrets.SSH_KEY_FINGERPRINT }} \
          --tag-name web \
          --wait

    - name: Wait for droplet to be ready
      run: |
        doctl auth init -t ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        IP=$(doctl compute droplet list the-wise-app --format PublicIPv4 --no-header)
        while ! nc -z $IP 22; do
          echo "Waiting for SSH to be available..."
          sleep 5
        done

    - name: Delete old DNS records
      run: |
        doctl auth init -t ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        records=$(doctl compute domain records list ${{ secrets.HOST_NAME }} --no-header --format ID,Type | grep " A " | cut -d' ' -f1)
        for record in $records; do
          echo "Deleting record $record..."
          doctl compute domain records delete ${{ secrets.HOST_NAME }} $record --force
        done
      
    - name: Create A record for ${{ secrets.HOST_NAME }}
      run: |
        doctl auth init -t ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        IP=$(doctl compute droplet list the-wise-app --format PublicIPv4 --no-header)
        doctl compute domain records create ${{ secrets.HOST_NAME }} --record-type A --record-name @ --record-data $IP --record-ttl 3600
        doctl compute domain records create ${{ secrets.HOST_NAME }} --record-type CNAME --record-name www --record-data @ --record-ttl 3600
#        doctl compute domain records create ${{ secrets.HOST_NAME }} --record-type CNAME --record-name admin --record-data @ --record-ttl 3600

    - name: Copy project to Droplet
      env:
        PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        PROJECT_DIR: ${{ env.PROJECT_DIR }}
      run: |
        doctl auth init -t ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        IP=$(doctl compute droplet list the-wise-app --format PublicIPv4 --no-header)
        echo "$PRIVATE_KEY" > private_key
        chmod 600 private_key
        ssh -i private_key -o StrictHostKeyChecking=no root@$IP "mkdir -p $PROJECT_DIR"
        scp -i private_key -o StrictHostKeyChecking=no -r ./* root@$IP:$PROJECT_DIR
        rm private_key

    - name: Wait for DNS Propagation
      run: |
        doctl auth init -t ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        IP=$(doctl compute droplet list the-wise-app --format PublicIPv4 --no-header)
        RETRIES=10
        DELAY=30
        for ((i=1;i<=RETRIES;i++)); do
          echo "Checking DNS propagation, attempt $i..."
          nslookup ${{ secrets.HOST_NAME }} && nslookup www.${{ secrets.HOST_NAME }} && break
          echo "DNS records not found. Retrying in $DELAY seconds..."
          sleep $DELAY
        done
        if [ $i -eq $((RETRIES+1)) ]; then
          echo "DNS records did not propagate in time."
          exit 1
        fi

    - name: Install and Configure Certbot, Validate Installation, and Manage SSL
      env:
        PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      run: |
        doctl auth init -t ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        IP=$(doctl compute droplet list the-wise-app --format PublicIPv4 --no-header)
        echo "$PRIVATE_KEY" > private_key
        chmod 600 private_key
        ssh -i private_key -o StrictHostKeyChecking=no root@$IP << 'EOF'
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          echo "Waiting for other process to release dpkg lock..."
          sleep 5
        done
        sudo apt-get update
        sudo apt-get install -y certbot python3-certbot-nginx
        if ! command -v certbot &> /dev/null; then
          echo "Certbot not installed"; exit 1
        fi
        sudo ufw disable
        sudo systemctl stop nginx
        sudo certbot certonly --standalone -d ${{ secrets.HOST_NAME }} -d www.${{ secrets.HOST_NAME }} --non-interactive --agree-tos -m ${{ secrets.LETS_ENCRYPT_EMAIL }}
        sudo bash -c 'cat <<EOL > /etc/nginx/sites-available/default
        server {
          listen 80;
          server_name ${{ secrets.HOST_NAME }} www.${{ secrets.HOST_NAME }};
          return 301 https://$server_name$request_uri;
        }
        server {
          listen 443 ssl http2;
          server_name ${{ secrets.HOST_NAME }} www.${{ secrets.HOST_NAME }};
          ssl_certificate /etc/letsencrypt/live/${{ secrets.HOST_NAME }}/fullchain.pem;
          ssl_certificate_key /etc/letsencrypt/live/${{ secrets.HOST_NAME }}/privkey.pem;
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_prefer_server_ciphers on;
          ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
          add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
          location / {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade \$http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;
            proxy_cache_bypass \$http_upgrade;
          }
        }
        EOL'
        sudo systemctl start nginx
        sudo ufw enable
        EOF
        rm private_key
      

