    - name: Install Docker Compose on Droplet
      env:
        PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      run: |
        doctl auth init -t ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        IP=$(doctl compute droplet list the-wise-app --format PublicIPv4 --no-header)
        echo "$PRIVATE_KEY" > private_key
        chmod 600 private_key
        ssh -i private_key -o StrictHostKeyChecking=no root@$IP << 'EOF'
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          echo "Waiting for release of dpkg lock..."
          sleep 5
        done
        apt-get update
        apt-get install -y docker-compose
        rm -rf /etc/update-motd.d/99-one-click
        EOF
        rm private_key

    - name: Create .env file on Droplet
      env:
        PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        PROJECT_DIR: ${{ env.PROJECT_DIR }}
        PORT: ${{ secrets.PORT }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      run: |
        doctl auth init -t ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        IP=$(doctl compute droplet list the-wise-app --format PublicIPv4 --no-header)
        echo "$PRIVATE_KEY" > private_key
        chmod 600 private_key
        ssh -i private_key -o StrictHostKeyChecking=no root@$IP << EOF
        echo "PORT=${{ secrets.PORT }}" >> $PROJECT_DIR/.env
        echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $PROJECT_DIR/.env
        echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> $PROJECT_DIR/.env
        echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> $PROJECT_DIR/.env
        echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> $PROJECT_DIR/.env
        EOF
        rm private_key


    - name: Deploy application
      env:
        PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        PROJECT_DIR: ${{ env.PROJECT_DIR }}
      run: |
        doctl auth init -t ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        IP=$(doctl compute droplet list the-wise-app --format PublicIPv4 --no-header)
        echo "$PRIVATE_KEY" > private_key
        chmod 600 private_key
        ssh -i private_key -o StrictHostKeyChecking=no root@$IP << 'EOF'
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          echo "Waiting for release of dpkg lock..."
          sleep 5
        done
        apt-get update
        apt-get install -y docker-compose
        cd /root/project/
        pwd
        ls
        docker-compose up -d
        EOF
        rm private_key

    - name: Validate SSL Certificate
      env:
        PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      run: |
        doctl auth init -t ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        IP=$(doctl compute droplet list the-wise-app --format PublicIPv4 --no-header)
        echo "$PRIVATE_KEY" > private_key
        chmod 600 private_key
        ssh -i private_key -o StrictHostKeyChecking=no root@$IP << 'EOF'
        if [ ! -f /etc/letsencrypt/live/${{ secrets.HOST_NAME }}/fullchain.pem ]; then
          echo "SSL Certificate not found"; exit 1
        fi
        EOF
        rm private_key